<!-- 서체: 본문 Pretendard(가변)·디스플레이 고운바탕 — display:swap, 오프라인 시 시스템 폴백으로 무해 -->

<style>
  :root{
    /* 절제된 고급감: 먹에 가까운 딥 모카(CTA 대비 AA 통과), 브론즈 골드(금은 어두울수록 격), 한지톤 카드 */
    --bg:#f3efe8; --card:#fffdf9; --ink:#39342e; --muted:#6e6759;
    --line:#e7e0d5; --primary:#8f6852; --primary-d:#734f3d;
    --sage:#647663; --sage-d:#5f7060; --rose:#c08497; --gold:#9c7c4a; --gold-text:#7f6430;
    --ok:#43724f; --warn:#8c5e2a; --danger:#9d4f41;
    --tint:#fbf8f3; --tint2:#fbf6f1; --field:#fcfbf9; --seg-bg:#efe9e0; --ic-bg:#f4eee4; --dd-bg:#f4eedd; --note-bg:#faf7f2;
    --radius:14px; --shadow:0 1px 2px rgba(57,52,46,.05),0 6px 20px rgba(57,52,46,.06);
  }
  html[data-theme="dark"]{
    --bg:#201d19; --card:#2a2621; --ink:#ece5da; --muted:#a69c8e; --line:#39332c;
    --primary:#c69c82; --primary-d:#dcb89e; --sage:#94a594; --sage-d:#b0c3b0; --rose:#d09aaa; --gold:#c3a978; --gold-text:#d9bd85;
    --ok:#84b695; --warn:#daa86a; --danger:#df9181;
    --tint:#322d27; --tint2:#37302a; --field:#322d27; --seg-bg:#38322b; --ic-bg:#38312a; --dd-bg:#38312a; --note-bg:#2f2a24;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.3);
  }
  /* 다크: 밝은 채움 위 흰 글자는 대비 탈락 — 진한 잉크로 반전(기존 .dday-pill 문법 확장) */
  html[data-theme="dark"] .btn-primary,html[data-theme="dark"] .btn-sage,html[data-theme="dark"] .chip.on,
  html[data-theme="dark"] .rrc.on,html[data-theme="dark"] .calday.sel,html[data-theme="dark"] .calday.sel.ev,
  html[data-theme="dark"] .minibtn.on,html[data-theme="dark"] .rm-noti.on,html[data-theme="dark"] .rm-dd,
  html[data-theme="dark"] .pbdg{color:#241f19}
  html[data-theme="dark"] .quote{color:#b5aa99}
  html[data-theme="dark"] .pill-gold,html[data-theme="dark"] .pchip{color:var(--gold)}
  html[data-theme="dark"] .footer,html[data-theme="dark"] .ftlink{color:#a59b8c}
  .homehero.mem .hh-nm .typ{color:#b0c3b0}
  html[data-theme="dark"] body{background:#16130f}
  html[data-theme="dark"] header{background:rgba(32,29,25,.92)}
  html[data-theme="dark"] .bnav{background:rgba(42,38,33,.96)}
  html[data-theme="dark"] .seg{background:#38322b}
  html[data-theme="dark"] .btn-ghost{background:#37312a}
  html[data-theme="dark"] .btn-line,html[data-theme="dark"] .minibtn,html[data-theme="dark"] .calnav,html[data-theme="dark"] .rrc,html[data-theme="dark"] .chip,html[data-theme="dark"] .rm-noti,html[data-theme="dark"] .seg2 button.on{background:#322d27}
  html[data-theme="dark"] .btn-disabled{background:#302b25;color:#7d746a}
  html[data-theme="dark"] .calday.ev{background:#38312a}
  html[data-theme="dark"] .hero{background:#2a2621}
  html[data-theme="dark"] .dday-pill,html[data-theme="dark"] .toast{background:#e8e1d5;color:#201d19}
  html[data-theme="dark"] .pill-ok,html[data-theme="dark"] .bal.pos{background:#20342a}
  html[data-theme="dark"] .pill-no,html[data-theme="dark"] .bal.neg{background:#3a2622}
  html[data-theme="dark"] .pill-wait{background:#34301f}
  html[data-theme="dark"] .bal.even{background:#302b24}
  html[data-theme="dark"] .pill-app{background:#233240;color:#9dbbdd}
  html[data-theme="dark"] .pill-cash{background:#332f24;color:#cbb888}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,a,input,select,textarea,summary{touch-action:manipulation} /* 핀치줌 허용하되 더블탭 줌 오작동 방지 */
  html,body{margin:0;padding:0;background:#e9e3d9;color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
    font-size:16.5px;line-height:1.55;letter-spacing:-.01em;
    word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",Georgia,serif;letter-spacing:.02em}
  /* 금액·날짜: 고정폭 숫자 = 정갈한 장부 */
  .stat .v,.reco-result .rr-v,.calevrow .rv,.grow .amt input,
  .calday,.hh-dd,.dday-pill,.evcard .dd,.rm-dd{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .phone{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,.12);position:relative;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:30;background:rgba(243,239,232,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  @keyframes viewin{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
  main>*{animation:viewin .18s ease-out}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand .logo{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:19px;letter-spacing:.1em;color:var(--primary-d)} /* 두 글자 '이음' — 자간이 낙관(落款)의 격 */
  .brand .slogan{font-size:11px;color:var(--muted);letter-spacing:.08em}
  .brand .dd{font-size:11px;color:var(--muted)}
  .seg{display:flex;background:#e7e0d5;border-radius:10px;padding:3px;margin-top:9px}
  .seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;
    font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button.on{background:var(--card);color:var(--primary-d);box-shadow:0 1px 4px rgba(0,0,0,.07)}
  main{padding:16px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-size:15.5px;letter-spacing:.02em}
  .card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500;letter-spacing:.02em}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);
    border-radius:10px;font-size:15.5px;background:var(--field);color:var(--ink);font-family:inherit}
  /* iOS 사파리: 16px 미만 입력 포커스 시 강제 확대(자동 줌) → iOS에서만 16px (핀치줌 정책은 유지) */
  @supports(-webkit-touch-callout:none){ input,select,textarea{font-size:17.5px} }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(143,104,82,.13)}
  html[data-theme="dark"] input:focus,html[data-theme="dark"] select:focus,html[data-theme="dark"] textarea:focus{box-shadow:0 0 0 3px rgba(198,156,130,.2)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    border:0;border-radius:11px;padding:13px;font-size:15.5px;font-weight:600;cursor:pointer;
    transition:background-color .18s ease,border-color .18s ease,transform .1s ease,box-shadow .18s ease;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .chip:active,.minibtn:active,.payopt:active,.calday:active{transform:scale(.96);transition:transform .1s ease}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-kakao{background:#FEE500;color:#3A1D1D}
  .btn-toss{background:#0064FF;color:#fff}
  .btn-ghost{background:#f1ece4;color:var(--ink);border:1px solid var(--line)}
  .btn-sage{background:var(--sage);color:#fff}
  .btn-line{background:var(--card);color:var(--primary-d);border:1px solid var(--primary)}
  .btn-sm{padding:9px 10px;font-size:14.5px;border-radius:9px}
  .btn[disabled],.btn-disabled{background:#ece7df;color:#b3aa9c;cursor:not-allowed;box-shadow:none}
  .btn-disabled .lock{font-size:11px;opacity:.7}
  .stack>*{margin-top:9px}
  .hero{text-align:center;padding:26px 18px 22px;background:
    radial-gradient(140% 100% at 50% 0%, #fffefb 0%, #f9f4eb 60%, #f4eee2 100%);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
  .hero .lead{font-size:10.5px;letter-spacing:.3em;font-weight:500;color:var(--gold-text);text-transform:uppercase}
  .hero .names{font-size:clamp(22px,7.5vw,27.5px);margin:12px 0 4px;color:var(--ink);line-height:1.45} /* 320px→24px: 4자♥4자 한 줄(실측 경계 25.6px) · 367px+ 27.5px */
  .hero .names span{color:var(--rose);margin:0 9px;font-size:18.5px;vertical-align:middle}
  .hero .when{font-size:14.5px;color:var(--muted);margin-top:9px;line-height:1.7}
.hero .hero-msg{font-size:15px;color:var(--muted);line-height:1.85;margin:14px auto 0;max-width:300px} /* 주최자 인사말 — 디데이 뱃지 바로 위 */
.hero.mem .hero-msg{color:#a99e8e}
  .hero .dday-pill{margin-top:8px} .hero .when{margin-top:12px}
.kp-step{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)} .kp-step:last-of-type{border-bottom:0}
.kp-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.kp-ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tint2);color:var(--primary-d);display:flex;align-items:center;justify-content:center}
.kp-t{font-size:16px;line-height:1.5;color:var(--ink)}
.dday-pill{display:inline-block;margin-top:13px;background:var(--ink);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.08em;padding:6px 14px;border-radius:999px}
  /* 부고 상세: 먹색 히어로 — 기쁜 자리가 아니므로 톤을 낮춘다 (homehero.mem 문법 재사용) */
  .hero{position:relative}
  .hero.mem{background:linear-gradient(180deg,#3a352f,#2c2823);border-color:#575047}
  .hero.mem .names{color:#e8e0d2}
  .hero.mem .when{color:#a99e8e}
  .hero.mem .lead{color:#8f857a;letter-spacing:.3em}
  .hero.mem .dday-pill{background:#d8cdbb;color:#26221d}
  html[data-theme="dark"] .hero.mem{background:linear-gradient(180deg,#332e28,#2a2621)}
  /* 알리기 확인 체크박스 행 */
  .ckrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--field);font-size:14.5px;margin-top:8px;cursor:pointer;color:var(--ink)}
  .ckrow input{width:18px;height:18px;flex:none;margin:0;accent-color:var(--primary);padding:0}
  .ckrow span{flex:1;line-height:1.5}
  .quote{font-size:15px;color:#6a6258;text-align:center;line-height:1.9;padding:4px 6px 0}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;letter-spacing:.01em}
  .pill-ok{background:#e7f0ea;color:var(--ok)}
  .pill-no{background:#f6e7e4;color:var(--danger)}
  .pill-wait{background:#f3ece1;color:var(--warn)}
  .pill-gold{background:var(--dd-bg);color:#7f6430}
  .pill-app{background:#e6eef6;color:#4a6f9a}
  .pill-cash{background:#f1ece1;color:#75663c}
  .card-thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 1px 5px}
  .card-thumb{flex:none;width:50px;height:64px;border-radius:11px;border:2px solid transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative}
  .pbdg{position:absolute;top:-6px;right:-5px;background:var(--gold);color:#fff;font-size:9px;font-weight:700;
    padding:1.5px 5.5px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .pchip{font-size:10px;font-weight:700;background:var(--dd-bg);color:#7f6430;padding:2px 8px;border-radius:999px;margin-left:4px}
  /* 결제 바텀시트 */
  .sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:.2s}
  .sheet-bg.show{opacity:1}
  .sheet{width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);
    transform:translateY(36px);transition:.22s}
  .sheet-bg.show .sheet{transform:none}
  .paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .payopt{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 12px;
    text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
  .payopt b{display:block;font-size:15px}
  .payopt small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
  .payopt.on{border-color:var(--primary);background:var(--tint2);box-shadow:0 0 0 1px var(--primary)}
  /* 튜토리얼 (스포트라이트 코치마크) */
  .tut-hi{position:relative!important;z-index:71!important;border-radius:14px;
    box-shadow:0 0 0 2px var(--gold),0 0 0 6px rgba(156,124,74,.22),0 0 0 9999px rgba(30,25,18,.5)!important}
  .tutbox{position:fixed;z-index:72;max-width:340px;width:calc(100% - 40px);background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);
    padding:15px 16px 13px;transition:top .25s ease,left .25s ease}
  .tutbox .tt{font-weight:700;font-size:16.5px;padding-right:26px;color:var(--ink)}
  .tutbox .tx{font-size:14.5px;color:var(--muted);line-height:1.65;margin-top:5px}
  .tutbox .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer;padding:5px;line-height:1}
  .tutdots{display:flex;gap:5px;margin:11px 0 0}
  .tutdots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
  .tutdots i.on{background:var(--gold);width:16px;border-radius:4px}
  .tutbtns{display:flex;gap:8px;margin-top:11px}
  .ftlink{border:0;background:none;color:#6e6759;font-size:10.5px;text-decoration:underline;cursor:pointer;padding:2px 4px;font-family:inherit;opacity:.85}
  /* Quick&Easy 메인: 다음 경조사 히어로 */
  .homehero{position:relative;background:radial-gradient(140% 110% at 50% 0%,#fffefa 0%,#f9f3e9 65%,#f4ecdd 100%);
    border:1px solid #d9c8a4;border-radius:16px;box-shadow:var(--shadow); /* 금테는 탈색 헤어라인으로만 암시 */
    padding:16px 16px 15px;margin-bottom:13px;cursor:pointer;text-align:center}
  .hh-top{display:flex;justify-content:space-between;align-items:center}
  .hh-dd{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;letter-spacing:.08em}
  .hh-ic{font-size:32px;margin-top:2px}
  .hh-nm{font-size:23px;margin-top:5px;color:var(--ink)}
  .hh-nm .typ{font-size:11px;color:var(--sage-d);font-weight:700}
  .hh-dt{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.7}
  .hh-btns{margin-top:12px}
  .homehero.mem{background:linear-gradient(180deg,#3a352f,#2c2823);border-color:#575047}
  .homehero.mem .hh-nm{color:#e8e0d2}.homehero.mem .hh-dt{color:#a99e8e}
  .homehero.mem .hh-dd{background:#d8cdbb;color:#26221d}
  html[data-theme="dark"] .homehero{background:linear-gradient(180deg,#332e28,#2a2621);border-color:#4a4234}
  html[data-theme="dark"] .hh-nm{color:#ece5da}
  /* 접이식 섹션 */
  details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:14px}

  const d=sampleData();
  d.events.forEach(e=>{ if(!S.events.find(x=>x.id===e.id)){ e.tut=true; S.events.push(e); } });
  d.people.forEach(p=>{ if(!S.people.find(x=>x.id===p.id)){ p.tut=true; S.people.push(p); } });

function migrate(o){ // 어떤 과거 상태가 와도 안전하게 현재 스키마로 (깊은 정규화 포함)
  const d=seed();
  if(!o||typeof o!=='object') return d;
  o._v=SCHEMA_VERSION;
  if(!Array.isArray(o.events)) o.events=[]; o.events=o.events.filter(e=>e&&typeof e==='object');
  if(!Array.isArray(o.people)) o.people=[]; o.people=o.people.filter(p=>p&&typeof p==='object');
  const legacyNoMeta = !(o.meta && typeof o.meta==='object'); // meta가 없던 v1.0 상태만 소급 태깅 대상
  o.settings={...d.settings, ...(o.settings||{})};
  o.meta={...d.meta, ...(o.meta||{})};
  o.ui={...d.ui, ...(o.ui||{})};
  o.ui.guestSession={...d.ui.guestSession, ...((o.ui&&o.ui.guestSession)||{})};
  delete o.ui.pendingRestore; // 복원 대기본은 메모리 전용 (LS 용량 2배·잔존 방지)
  if(!o.ui.payCatV101){ delete o.ui.payCat; o.ui.payCatV101=1; } // v101: 송금 기본 탭을 계좌이체로 — 이전 빌드가 렌더 시 자동 기록한 'easy'를 한 번만 초기화
  // 데모 태그 소급은 v1.0(메타 없음) 데이터에 '단 한 번만' — 이후 편집된 데이터에 재스탬프 금지
  if(legacyNoMeta){
    o.events.forEach(e=>{ if(['e1','e2','e3'].includes(e.id)) e.demo=true; });
    o.people.forEach(p=>{ if(['p1','p2','p3'].includes(p.id)) p.demo=true; });
  }
  // 이벤트/하객/계좌 깊은 정규화 (복원 파일 등 어떤 형태가 와도 뷰 크래시 방지)
  const seen=new Set();
  o.events.forEach(e=>{
    if(!e.id || seen.has(e.id)) e.id=uid('e'); seen.add(e.id);
    if(typeof e.type!=='string'||!TYPES[e.type]) e.type='wedding';
    ['partyA','partyB','subtitle','date','time','venue','address','message','externalUrl'].forEach(k=>{ if(typeof e[k]!=='string') e[k]=e[k]==null?'':String(e[k]); });
    e.externalUrl=safeUrl(e.externalUrl);                              // 복원·초대 페이로드의 임의 스킴 차단
    delete e.invitePhoto; // 초대카드 기능 철거(2026-09) — 잔존 사진 데이터 제거
    if(typeof e.thanksPhoto!=='string' || !/^data:image\//.test(e.thanksPhoto)) delete e.thanksPhoto;
    if(!Array.isArray(e.accounts)) e.accounts=[];
    e.accounts=e.accounts.filter(a=>a&&typeof a==='object');
    e.accounts.forEach(a=>{ ['label','bank','number','holder'].forEach(k=>{ if(typeof a[k]!=='string') a[k]=a[k]==null?'':String(a[k]); }); a.kakaopay=safeUrl(a.kakaopay); });
    if(!Array.isArray(e.guests)) e.guests=[];
    e.guests=e.guests.filter(g=>g&&typeof g==='object');
    e.guests.forEach(g=>{ if(!g.id)g.id=uid('g'); if(typeof g.name!=='string')g.name=String(g.name||'');
      g.pay={amount:null,source:null,method:null, ...(g.pay&&typeof g.pay==='object'?g.pay:{})}; });
  });
  const pseen=new Set();
  o.people.forEach(p=>{ if(!p.id||pseen.has(p.id))p.id=uid('p'); pseen.add(p.id);
    if(!Array.isArray(p.items))p.items=[]; p.items=p.items.filter(i=>i&&typeof i==='object'); });
  return o;
}
/* 사용자가 손댄 순간 그 데이터는 더이상 '샘플'이 아님 → 자동삭제로부터 보호(승격).
   단 '튜토리얼 진행 중'의 데모 조작은 연습이므로 승격하지 않음 → 종료 시 함께 삭제("데모는 지워져요" 약속). */
function own(ev){ if(!ev) return ev;
  if(typeof TUT!=='undefined' && TUT.on && (ev.demo||ev.tut)) return ev;
  if(ev.demo) delete ev.demo; if(ev.tut) delete ev.tut; if(ev.draft) delete ev.draft; return ev; }
let S=load();
function load(){
  try{ const r=localStorage.getItem(LS); if(r) return migrate(JSON.parse(r)); }catch(e){}
  return seed();
}
/* ---- IndexedDB 미러: localStorage가 비워져도(브라우저 정리 등) 자동 복구 ---- */
function idbOpen(){ return new Promise((res,rej)=>{ try{ const q=indexedDB.open('ieum-db',1);
  q.onupgradeneeded=()=>{ try{q.result.createObjectStore('kv');}catch(e){} };
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }catch(e){rej(e);} }); }
function idbSet(k,v){ return idbOpen().then(db=>new Promise(res=>{ const tx=db.transaction('kv','readwrite');
  tx.objectStore('kv').put(v,k); tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();res(false);} })).catch(()=>false); }
function idbGet(k){ return idbOpen().then(db=>new Promise(res=>{ const tx=db.transaction('kv','readonly');
  const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>{db.close();res(rq.result);}; rq.onerror=()=>{db.close();res(undefined);} })).catch(()=>undefined); }
function coreData(){ return {events:S.events, people:S.people, settings:S.settings, meta:S.meta, theme:S.ui.theme||'auto'}; }
let _mirrorT=null;
function mirror(){ clearTimeout(_mirrorT); _mirrorT=setTimeout(()=>{ try{ idbSet('state', JSON.stringify(coreData())); }catch(e){} }, 600); }
function tryAutoRecover(){ // 부팅 시: LS는 비었는데 미러(IDB)에 실데이터가 있으면 복구 → 그래도 비면 앱 내부 파일(네이티브)에서
  if(localStorage.getItem('ieum_wiped')){ return Promise.resolve(); } // 사용자가 명시 삭제함 — 미러로 되살리지 않음
  if(S.events.length||S.people.length) { dailySnapshot(); return Promise.resolve(); }
  return idbGet('state').then(rawStr=>{ try{ const raw=rawStr&&JSON.parse(rawStr);
    if(raw && ((raw.events&&raw.events.length)||(raw.people&&raw.people.length))) adoptRaw(raw); }catch(e){}
    return nativeRecover().catch(()=>false); }).then(()=>{ dailySnapshot(); });
}
const APP_VER='1.2'; // 데이터 보호 정책 버전 — 부팅 스냅샷 라벨용
function bootRawSnapshot(){ // 업데이트/마이그레이션 버그 대비: 가공 전 localStorage 원본을 3세대 롤링 보관 (IDB)
  try{ const raw=localStorage.getItem(LS); if(!raw) return;
    idbGet('boot-raw').then(s=>{ let arr=[]; try{ arr=JSON.parse(s||'[]'); }catch(e){}
      if(arr.length && arr[arr.length-1].j===raw) return; // 변화 없으면 스킵
      arr.push({d:todayStr(), v:APP_VER, j:raw}); while(arr.length>3) arr.shift();
      idbSet('boot-raw', JSON.stringify(arr)); }); }catch(e){} }
function dailySnapshot(){ // 하루 1회 롤링 스냅샷 5개 (실수 삭제·오염 대비)
  if(!(S.events.length||S.people.length)) return;
  const today=todayStr();
  idbGet('snaps').then(s=>{ let snaps=[]; try{ snaps=JSON.parse(s||'[]'); }catch(e){}
    if(snaps.length && snaps[snaps.length-1].d===today) return;
    snaps.push({d:today, j:JSON.stringify(coreData())}); while(snaps.length>5) snaps.shift();
    idbSet('snaps', JSON.stringify(snaps)); });
}
/* ---- 저장: 데이터가 실제로 바뀐 저장만 dirty·미러 반영 (내비게이션 저장은 제외) ---- */
let _lastDataSig=null;
function dataSig(){ try{ return JSON.stringify({e:S.events,p:S.people,s:S.settings}); }catch(e){ return null; } }
function save(){
  const sig=dataSig();
  const changed = sig!==null && sig!==_lastDataSig;
  if(changed && S.meta){ S.meta.dirty=(S.meta.dirty||0)+1; _lastDataSig=sig;
    if(S.events.length||S.people.length){ try{ localStorage.removeItem('ieum_wiped'); }catch(e){} } }
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ toast('저장 공간이 부족해요 — 데이터 정리나 백업을 권장'); }
  // 미러 갱신 제외 2경우: stale 탭 내비 저장 / 튜토리얼 중 데모 상태(자동복구 유일본을 데모로 덮는 사고 방지)
  if(changed && !(typeof TUT!=='undefined' && TUT.on)) mirror();
  if(changed){ try{ nativeMirror(); nativeNotiSync(); }catch(_){} } // 네이티브: 앱 내부 파일 미러·알림 예약 (웹에선 no-op)
}
_lastDataSig=dataSig(); // 부팅 기준선
function reset(){
  if(!confirm('모든 데이터를 삭제할까요?\n백업하지 않았다면 복구할 수 없어요.'))return;
  if(!confirm('정말 삭제합니다. 계속할까요?'))return;
  clearTimeout(_mirrorT);
  localStorage.removeItem(LS);
  try{ localStorage.setItem('ieum_wiped','1'); }catch(e){}           // 미러 부활 방지
  try{ indexedDB.deleteDatabase('ieum-db'); }catch(e){}              // state·snaps·pre-restore 전부 삭제
  try{ nativeWipe(); }catch(e){}                                     // 네이티브 앱 내부 파일도
  S=seed(); _lastDataSig=dataSig(); applyTheme(); render(); toast('모든 데이터를 삭제했어요');
}
/* ---- 멀티탭 동기화: 다른 탭이 저장하면 이 탭도 그 상태를 채택 (last-writer 덮어쓰기 방지) ---- */
window.addEventListener('storage', e=>{
  if(e.key!==LS || e.newValue==null) return;
  try{
    const tut=(typeof TUT!=='undefined' && TUT.on);
    if(tut){ try{ abortTutorial(); }catch(_){} } // 다른 탭 상태 채택 전 투어 정리(빈 화면 위 코치마크 방지)
    S=migrate(JSON.parse(e.newValue)); _lastDataSig=dataSig(); applyTheme(); render();
    if(tut) toast('다른 탭의 변경사항을 반영해 튜토리얼을 종료했어요');
  }catch(err){}
});
/* ---- 저장소 영속화 요청 (브라우저 자동정리 방지) ---- */
/* 저장소 영속화 요청 — 주의: iOS 사파리 ITP의 '7일 무방문 삭제'는 persist로 못 막음(홈화면 설치만 면제).
   안드로이드 크롬의 저장공간 압박 축출 방지용으로만 유효. iOS 보호는 파일백업+넛지로 별도 처리. */
try{ if(navigator.storage&&navigator.storage.persist&&!localStorage.getItem('ieum_persist')){
  navigator.storage.persist().then(g=>{ if(g)localStorage.setItem('ieum_persist','1'); }); } }catch(e){}
function applyTheme(){ const t=(S.ui&&S.ui.theme)||'auto';
  const dark = t==='dark' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark?'dark':'light';
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark?'#201d19':'#a87f6a');
  try{ nativeStatusBar(); }catch(e){} }
function setTheme(t){ S.ui.theme=t; save(); applyTheme(); render(); }
try{ if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(((S.ui&&S.ui.theme)||'auto')==='auto') applyTheme(); }); }catch(e){}

/* ======================= 유틸 ======================= */
const $=s=>document.querySelector(s);
const won=n=>'₩'+(Number(n)||0).toLocaleString('ko-KR');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
const cfg=ev=>TYPES[ev.type]||TYPES.wedding;
function evName(ev){const c=cfg(ev);return ev.partyB?`${esc(ev.partyA)}${c.sep?` <span>${c.sep}</span> `:' '}${esc(ev.partyB)}`:esc(ev.partyA);}
function evNamePlain(ev){const c=cfg(ev);return ev.partyB?`${ev.partyA}${c.sep?' '+c.sep+' ':' '}${ev.partyB}`:ev.partyA;}
function dateText(ev){if(!ev.date)return '';const d=new Date(ev.date+'T'+(ev.time||'00:00'));
  const w=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${w[d.getDay()]}) ${ev.time||''}`;}
function dday(ev){if(!ev.date)return '';const t=new Date();t.setHours(0,0,0,0);
  const d=new Date(ev.date+'T00:00');const n=Math.round((d-t)/86400000);
  return n>0?`D-${n}`:n===0?'D-DAY':`D+${-n}`;}
function copy(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).catch(()=>fbCopy(text));}else fbCopy(text);}
function fbCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.readOnly=true; // iOS: readOnly로 키보드 억제
  ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  try{ const r=document.createRange(); r.selectNodeContents(ta); const s=getSelection(); s.removeAllRanges(); s.addRange(r);

function lzwEnc(str){ const s=unescape(encodeURIComponent(str)); const dict=new Map(); let size=256;
  for(let i=0;i<256;i++) dict.set(String.fromCharCode(i),i);
  let w='', out=[];
  for(const c of s){ const wc=w+c;
    if(dict.has(wc)) w=wc;
    else { out.push(dict.get(w)); if(size<65536) dict.set(wc,size++); w=c; } }
  if(w) out.push(dict.get(w));

  return btoa(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function lzwDec(b64){ let s=b64.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='=';
  const bytes=atob(s); const codes=[];
  for(let i=0;i+1<bytes.length;i+=2) codes.push((bytes.charCodeAt(i)<<8)|bytes.charCodeAt(i+1));
  const dict=new Map(); let size=256;
  for(let i=0;i<256;i++) dict.set(i,String.fromCharCode(i));
  let w=dict.get(codes[0]), res=w;
  for(let i=1;i<codes.length;i++){ const k=codes[i]; let entry;
    if(dict.has(k)) entry=dict.get(k); else if(k===size) entry=w+w[0]; else throw new Error('lzw');
    res+=entry; if(size<65536) dict.set(size++, w+entry[0]); w=entry; }

function b64urlEnc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDec(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4)str+='='; return decodeURIComponent(escape(atob(str))); }

function relayPull(force){ if(!RELAY.url) return; // 호스트: 내 행사 사서함 확인 (20초 스로틀, force=수동)
  if(_relayPullP){ if(force){ _relayForce=true; toast('확인하는 중이에요…'); } return _relayPullP; } // 진행 중이면 합류 — 사서함(읽기 1회 삭제)을 두 요청이 나눠 받지 않게
  if(!force && Date.now()-_relayPullAt<20000) return; _relayPullAt=Date.now(); _relayForce=!!force;
  _relayPullP=(async()=>{ let total=0, failed=0;
    const hosts=S.events.filter(e=>e.role==='host'&&evHasContent(e)); const multi=hosts.length>1;
    for(const ev of hosts){
      try{ const k=await relayKey(ev);
        const r=await fetch(RELAY.url+'/replies?k='+k); if(!r.ok){ failed++; continue; }
        const arr=await r.json(); if(!Array.isArray(arr)||!arr.length) continue;
        let n=0;
        arr.forEach(code=>{ try{ const o=JSON.parse(b64urlDec(code));
          if(o.k===evKey(ev) && mergeGuestReply(ev,o)) n++; }catch(e){} });
        if(n){ total+=n; save();
          const a=document.activeElement, typing=!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); // 장부 입력 중이면 DOM 교체로 입력값·키보드를 날리지 않는다
          if(typing){ try{ if(S.ui.tab==='host'&&(S.ui.hostTab||'setup')==='ledger'&&hostEvent()&&hostEvent().id===ev.id) updateHostLedgerUI(ev); }catch(e){} } else render();
          const who=multi?`「${evNamePlain(ev)||ev.date||'이름 없는 행사'}」 `:'';
          setTimeout(()=>toast(typing?`${who}명부 기록 ${n}건을 받았어요 — 입력을 마치면 명단에 보여요`:`${who}명부 기록 ${n}건이 장부에 반영됐어요 ✓`),300); }
      }catch(e){ failed++; } }
    if(_relayForce&&!total) toast(failed?'확인하지 못했어요 — 네트워크를 확인해 주세요':'새 기록이 없어요');
  })().finally(()=>{ _relayPullP=null; _relayForce=false; });
  return _relayPullP; }

const _probeCache={}; // URL별 결과 캐시 — 재공유 시 대기 없이
function _probeImg(url,ms){ if(url in _probeCache) return Promise.resolve(_probeCache[url]);
  return new Promise(res0=>{ const res=v=>{ _probeCache[url]=v; res0(v); }; try{ if(!url||!/^https:/.test(url)) return res(false);
  const im=new Image(); let done=false; const t=setTimeout(()=>{ if(!done){done=true;res(false);} },ms||3500);
  im.onload=()=>{ if(!done){done=true;clearTimeout(t);res({w:im.naturalWidth||800,h:im.naturalHeight||400});} };
  im.onerror=()=>{ if(!done){done=true;clearTimeout(t);res(false);} };
  im.src=url; }catch(e){ res(false); } }); }
/* 외부 모바일청첩장 링크를 그대로 공유 → 그 청첩장의 썸네일이 카카오톡에 뜸 */

function smsHref(body){ const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent); // iOS는 'sms:&body=', 안드로이드는 'sms:?body=' — 형식이 다르다
  return (ios?'sms:&body=':'sms:?body=')+encodeURIComponent(body); }

  if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){ copy(body); toast('문자 본문을 복사했어요 — 폰에서 열면 문자앱으로 바로 보내져요'); return; }

/* 파일 내보내기 공용: 공유시트 우선(iOS 설치형에서 a[download]는 무동작) → 다운로드 폴백. 성공했을 때만 성공 토스트 */
function exportFile(blob, fname, shareText, okMsg){
  const file=new File([blob],fname,{type:blob.type||'application/octet-stream'});
  const dl=()=>{ if(noDownload()){ toast(isInApp()?'이 브라우저에선 파일 저장이 막혀 있어요 — Safari로 열어 저장해 주세요':'이 화면에선 파일 저장이 제한돼요 — 사파리에서 열어 저장해 주세요'); return; }
    dlBlob(blob,fname); toast(okMsg); };
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], text:shareText||fname}).then(()=>toast(okMsg))
      .catch(err=>{ if(err&&err.name==='AbortError'){ return; } dl(); });
    return;
  }
  dl();
}

  if(!S.ui.entered){ if(bn)bn.style.display='none'; if(hn)hn.style.display='none'; $('#ddayTop').textContent=''; $('#app').innerHTML=landingView(); return; }
  if(S.ui.tab==='host'){ if(bn)bn.style.display='none'; const he=hostEvent()||ensureHostEvent();
    const sub=S.ui.hostSub==='thanks';
    if(hn){ hn.style.display=sub?'none':'flex'; hn.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-h')===(S.ui.hostTab||'setup'))); }
    $('#ddayTop').textContent = he?dday(he):''; $('#app').innerHTML = sub?thanksView():hostView();
    if(typeof TUT!=='undefined' && TUT.on) setTimeout(tutApply,30); // 주최자 파트 코치마크
    try{ histGuard(); }catch(e){} return; }
  if(hn)hn.style.display='none';
  if(bn){ bn.style.display='flex'; }
  $('#ddayTop').textContent='';
  const v=S.ui.guestView;
  $('#app').innerHTML =
      v==='invite' ? inviteView()
    : v==='handoff' ? handoffView()
    : v==='restore' ? restoreView()
    : v==='import' ? importView()
    : v==='allev' ? allEventsView()
    : v==='ledger' ? ledgerView()
    : v==='add' ? addView()
    : v==='reco' ? recoView()
    : v==='more' ? moreView()
    : v==='people' ? peopleView()
    : v==='person' ? personView()
    : v==='personadd' ? personAddView()
    : v==='tx' ? txView()
    : v==='settings' ? settingsView()
    : v==='doc' ? docView()
    : v==='detail' ? guestDetail() : guestList();
  updateBottomNav();
  if(typeof TUT!=='undefined' && TUT.on) setTimeout(tutApply,30); // 렌더 후 코치마크 재적용
  try{ histGuard(); }catch(e){} // 세부 화면이면 백버튼 가드 장전
}

function ensureHostEvent(){ // 빈 시작에서도 호스트 모드가 안전하도록 (미입력 초안은 draft — 목록 비노출·이탈 시 정리)
  let ev=S.events.find(e=>e.id===S.ui.hostEventId) || S.events.find(e=>e.role==='host');
  if(!ev){ ev={ id:uid('e'), draft:true, role:'host', type:'wedding', partyA:'', partyB:'', subtitle:'저희 결혼합니다',
    date:'', time:'13:00', venue:'', address:'', message:'', externalUrl:'',
    accounts:[{label:'신랑측',bank:'카카오뱅크',number:'',holder:''},{label:'신부측',bank:'토스뱅크',number:'',holder:''}], guests:[] };
    S.events.push(ev); S.ui.hostEventId=ev.id; save(); }
  S.ui.hostEventId=ev.id; return ev; }
function pruneDraft(){ // 아무것도 입력 안 한 호스트 초안은 나갈 때 조용히 제거
  const before=S.events.length;
  S.events=S.events.filter(e=>!(e.draft && e.role==='host' && !evHasContent(e)));
  if(S.events.length!==before){ if(!S.events.find(e=>e.id===S.ui.hostEventId)) S.ui.hostEventId=null; save(); } }
function tutAutoOk(){ // 첫 설치 판정: 빈 초안(draft)은 제외, 자동복구로 데이터가 도착했으면 취소
  return S.meta && !S.meta.tutDone && !S.people.length
    && !S.events.filter(e=>!(e.draft&&!evHasContent(e))).length; }
function enterAs(mode){ S.ui.tab=mode; if(mode==='guest'){ S.ui.guestView='list'; } else { ensureHostEvent(); S.ui.hostTab='setup'; } S.ui.entered=true; save(); render(); window.scrollTo(0,0);
  // 첫 설치(빈 데이터) 유저: 튜토리얼 자동 시작 (X로 닫으면 다시 안 뜸)
  }
function goLanding(){ try{ abortTutorial(); }catch(e){} try{ pruneDraft(); }catch(e){}
  S.ui.entered=false; save(); render(); window.scrollTo(0,0); }

/* ---------- 호스트 ---------- */
function hostFoldSet(k,v){ if(!S.ui.hostFold)S.ui.hostFold={}; S.ui.hostFold[k]=v; }
/* ---- 내 행사 여러 개: 맨 위 [새 행사 만들기] + 다른 행사는 접힌 목록에서 전환 ---- */
function hostSwitcher(ev){ const hosts=S.events.filter(e=>e.role==='host'&&(e.id===ev.id||evHasContent(e))); const others=hosts.filter(e=>e.id!==ev.id);
  return `<div class="row" style="align-items:center;margin:0 0 10px">
    <div style="flex:1;font-weight:700;font-size:14px">${hosts.length>1?`내 행사 ${hosts.length}건`:'내 행사'}</div>
    <button class="minibtn" style="color:var(--primary);font-weight:700" onclick="newHostEvent()">＋ 새 행사 만들기</button></div>
  ${others.length?`<details class="fold hostsw" style="margin-bottom:10px"><summary>다른 행사 ${others.length}건 </summary>
    <div class="fold-body">${others.map(e=>`<button class="backbtn" style="display:block;width:100%;text-align:left;margin:4px 0" onclick="switchHostEvent('${e.id}')">${cfg(e).icon} ${esc(evNamePlain(e)||'(이름 없음)')} <span style="color:var(--muted);font-size:12px">· ${e.date||'날짜 미정'} · 하객 ${(e.guests||[]).length}명</span></button>`).join('')}</div></details>`:''}`; }
function newHostEvent(){ const cur=hostEvent(); if(cur&&!evHasContent(cur)){ toast('먼저 이 행사의 정보를 입력해 주세요'); hostFoldSet('info',true); render(); return; }
  pruneDraft(); const ev={ id:uid('e'), draft:true, role:'host', type:'wedding', partyA:'', partyB:'', subtitle:'저희 결혼합니다', date:'', time:'13:00', venue:'', address:'', message:'', externalUrl:'',
    accounts:[{label:'신랑측',bank:'카카오뱅크',number:'',holder:''},{label:'신부측',bank:'토스뱅크',number:'',holder:''}], guests:[] };
  S.events.push(ev); S.ui.hostEventId=ev.id; S.ui.hostTab='setup'; S.ui.hostFold={info:true}; save(); render(); window.scrollTo(0,0); toast('새 행사를 만들었어요 — 정보를 입력해 주세요'); }
function switchHostEvent(id){ if(!S.events.find(e=>e.id===id)) return; pruneDraft(); S.ui.hostEventId=id; S.ui.hostTab='setup'; S.ui.hostFold={}; save(); render(); window.scrollTo(0,0); }
function shareFromHost(kind){ const ev=hostEvent(); if(!ev)return;
  if(!ev.partyA || !ev.date){ // 빈 청첩장 발송 방지
    toast('행사 정보(이름·날짜)를 먼저 입력해 주세요');
    hostFoldSet('info',true); render(); window.scrollTo(0,0); return; }
  // 대규모 행사(FREE_GUESTS명+) 발송 게이트 — 장부 인원 기준. 오픈 수는 2차 전파로 부풀 수 있어 과금 근거로 쓰지 않음. 부고는 예외(장례 중 결제 UI 금지).
  if(!hasPass(ev) && ev.type!=='memorial' && (ev.guests||[]).length>=FREE_GUESTS){
    passTrack('bigEvent'); passPrompt(()=>shareFromHost(kind),`하객 ${FREE_GUESTS}명 이상의 큰 행사예요. 새 발송에만 패스가 필요해요.`); return; }
  if(kind==='sms') shareEventSMS(ev); else shareEvent(ev); }
function hostView(){
  const ev=hostEvent(); const c=cfg(ev); const led=ledgerStats(ev);
  const hf=S.ui.hostFold||{};

  const ht=S.ui.hostTab||'setup';
  const back=`<button class="backbtn" onclick="backFromHost()">‹ 내 경조사</button>`;

  if(ht==='ledger') return back+`

    <div class="secthead"><div class="t">📒 장부 정리</div><div class="c">하객 ${ev.guests.length}명 <button class="minibtn" style="margin-left:6px" onclick="relayPull(true)">↻ 새로고침</button></div></div>
    <div class="stats">

    </div>

    <div class="secthead" style="margin:16px 0 4px"><div class="t">하객 명단 · 매칭</div></div>
    ${ev.guests.length>7?`<input id="hgq" placeholder="🔍 하객 이름 검색" value="${esc(HGQ)}" oninput="HGQ=this.value;renderHostGuests()" style="margin-bottom:9px">`:''}
    <div class="glist" id="hg-list">
      ${hostGuestsHTML(ev)}
    </div>
    <div class="row" style="margin-top:10px;align-items:stretch">
      <input id="hg_name" placeholder="하객 이름" style="flex:2">
      ${ev.accounts.length>1?`<select id="hg_side" style="flex:1;max-width:34%">${ev.accounts.map((a,i)=>`<option value="${i}">${esc(a.label)}</option>`).join('')}</select>`:''}
    </div>
    <button class="badge-add" style="margin-top:8px" onclick="addGuestInline()">＋ 하객 추가</button>
    ${ev.guests.some(x=>x.unregistered)?`
      <div class="secthead" style="margin:18px 0 6px"><div class="t" style="color:var(--warn)">미매칭 풀 · 신규 입금</div><div class="c">명단에 없던 입금</div></div>
      <div class="glist">${ev.guests.filter(x=>x.unregistered).map(x=>rowHost(ev,x)).join('')}</div>`:''}
  </div>`;

  if(ht==='more') return back+`

  <div class="card">
    <h3>행사 마무리</h3>
    <div class="stack">
      <button class="btn btn-ghost" onclick="exportXlsxGate()">장부 엑셀 내보내기 · 서식 포함 ${ev.type==='memorial'?'':passChip(ev)}</button>
      <button class="btn btn-ghost" onclick="openThanks()">${ev.type==='memorial'?'답례 인사 준비하기':'감사 인사 준비하기'}</button>
    </div>
  </div>

  <button class="backbtn" style="color:var(--danger);margin:0 4px 10px" onclick="delEvent('${ev.id}')">이 행사 삭제</button>`;

  // 기본(행사·보내기 탭): 정보 입력 → 계좌 → 보내기 순서 — 위에서 아래로 채우면 끝나는 흐름
  return back+hostSwitcher(ev)+`
  <details class="fold" ${infoOpen?'open':''} ontoggle="hostFoldSet('info',this.open)">
    <summary>✏️ 행사 정보 ${infoDone?`<span style="font-weight:400;color:var(--muted);font-size:12px">· ${esc(evNamePlain(ev))} · ${ev.date}</span>`:`<span class="pchip" style="background:#f6e7e4;color:var(--danger)">입력 필요</span>`}</summary>
    <div class="fold-body">
    <label style="margin-top:0">경조사 유형</label>
    <div class="seg2">
      ${['wedding','hwahon','memorial'].map(t=>`<button class="${ev.type===t?'on':''}" onclick="setType('${t}')">${TYPES[t].icon} ${TYPES[t].label}</button>`).join('')}
    </div>



    <div class="row" style="margin-top:8px">
      <div><label>${c.nameA}</label><input value="${esc(ev.partyA)}" onchange="updEv('partyA',this.value)"></div>
      ${c.counts||ev.partyB?`<div><label>${c.nameB}</label><input value="${esc(ev.partyB)}" onchange="updEv('partyB',this.value)"></div>`:`<div><label>${c.nameB}</label><input value="${esc(ev.partyB)}" placeholder="(선택)" onchange="updEv('partyB',this.value)"></div>`}
    </div>
    <div class="row">
      <div><label>${c.dateL}</label><input type="date" value="${ev.date}" onchange="updEv('date',this.value)"></div>
      <div><label>시간</label><input type="time" value="${ev.time}" onchange="updEv('time',this.value)"></div>
    </div>
    <label>${c.venueL}</label><input value="${esc(ev.venue)}" onchange="updEv('venue',this.value)">
    <label>주소</label><input value="${esc(ev.address)}" onchange="updEv('address',this.value)">
    <label>인사말</label><textarea rows="3" onchange="updEv('message',this.value)">${esc(ev.message)}</textarea>
    </div>
  </details>

  <details class="fold" ${acctOpen?'open':''} ontoggle="hostFoldSet('acct',this.open)">
    <summary>🏦 ${c.money} 받을 계좌 ${acctDone?`<span style="font-weight:400;color:var(--ok);font-size:12px">· 등록됨</span>`:`<span style="font-weight:400;color:var(--muted);font-size:12px">· 미입력</span>`}</summary>
    <div class="fold-body">

    </div>
  </details>

  <div class="card">
    <h3>📨 하객에게 보내기</h3>
    ${infoDone?'':`<div class="note" style="margin-top:8px">위의 <b>행사 정보</b>(이름·날짜)를 먼저 입력하면 보낼 수 있어요.</div>`}
    <label style="margin-top:12px">모바일 ${c.doc} 링크 추가 (선택)</label>

    ${ev.externalUrl&&ev.shareImg?`<img src="${esc(ev.shareImg)}" alt="" style="width:76px;height:95px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin:4px 0 2px" onerror="this.style.display='none'">`:''}

    </div>

  </div>`;
}
function exportXlsxGate(){ const ev=hostEvent(); if(ev&&ev.type==='memorial'){ exportLedgerXLSX(); return; } withPass('xlsx',exportLedgerXLSX); } // 부고는 결제 UI 금지 — 게이트 없이 바로
function addHostAcct(){ const ev=hostEvent(); if(!ev) return; if((ev.accounts||[]).length>=6){ toast('계좌는 최대 6개까지예요'); return; }
  own(ev); ev.accounts.push({label:ev.type==='memorial'?'상주측':'혼주측', bank:'국민', number:'', holder:''}); save(); render(); }
function delHostAcct(i){ const ev=hostEvent(); if(!ev||!ev.accounts[i]) return;
  if(ev.accounts[i].number && !confirm(`'${ev.accounts[i].label}' 계좌를 삭제할까요?`)) return;
  own(ev); ev.accounts.splice(i,1); save(); render(); }
function acctEditor(i,a){
  const mem=(hostEvent()||{}).type==='memorial'; // 부고는 고정 계좌가 상주측 1개 → 두 번째부터 삭제 가능
  return `<div style="margin-top:10px">
    <div class="row" style="align-items:center">
      <input style="max-width:46%;font-weight:600" value="${esc(a.label)}" placeholder="라벨 (예: ${mem?'상주측':'혼주측'})" onchange="updAcct(${i},'label',this.value)">
      ${i>=(mem?1:2)?`<button class="btn btn-ghost btn-sm" style="max-width:70px" onclick="delHostAcct(${i})">삭제</button>`:''}
    </div>
    <div class="row" style="margin-top:5px">
      <div style="max-width:40%"><select onchange="updAcct(${i},'bank',this.value)">
        ${BANKS.map(b=>`<option ${b===a.bank?'selected':''}>${b}</option>`).join('')}</select></div>
      <div><input placeholder="계좌번호" value="${esc(a.number)}" onchange="updAcct(${i},'number',this.value)"></div>
    </div>
    <input style="margin-top:6px" placeholder="예금주" value="${esc(a.holder)}" onchange="updAcct(${i},'holder',this.value)">
    <div class="row" style="margin-top:6px;align-items:center">
      <input placeholder="카카오페이 송금링크 (선택)" value="${esc(a.kakaopay||'')}" onfocus="kpFocus(this)" onchange="updAcct(${i},'kakaopay',this.value)">
      <button class="minibtn" style="max-width:96px;white-space:nowrap" onclick="openKpGuide()">링크 얻는 법</button>
    </div></div>`;
}
/* ---- 카카오페이 송금링크 안내: 앱에는 '링크 복사' 버튼이 없고 QR(이미지)만 준다 → QR을 인식해 qr.kakaopay.com 링크를 얻는 실제 경로 (2026-09 확인) ---- */

function ymToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ensureCalYM(){ if(!S.ui.calYM){ const ds=S.events.map(e=>e.date).filter(Boolean).sort(); const t=todayStr();
  const near=ds.find(d=>d>=t)||ds[0]; S.ui.calYM = near ? near.slice(0,7) : ymToday(); } }
function selDateLabel(ds){const d=new Date(ds+'T00:00');const w=['일','월','화','수','목','금','토'];return `${d.getMonth()+1}월 ${d.getDate()}일 (${w[d.getDay()]})`;}
function calNav(delta){ ensureCalYM(); let [y,m]=S.ui.calYM.split('-').map(Number);
  const idx=y*12+(m-1)+delta; y=Math.floor(idx/12); m=idx%12+1;
  S.ui.calYM=y+'-'+String(m).padStart(2,'0'); S.ui.calSelDate=null; save(); render(); }
function calPick(ds){ S.ui.calSelDate = (S.ui.calSelDate===ds ? null : ds); save(); render(); }
function calToday(){ S.ui.calYM=ymToday(); S.ui.calSelDate=null; save(); render(); }

function calendarHTML(){
  ensureCalYM();
  const [y,m]=S.ui.calYM.split('-').map(Number);
  const startDow=new Date(y,m-1,1).getDay();
  const daysIn=new Date(y,m,0).getDate();
  const t=todayStr();
  const evCount={}; S.events.forEach(e=>{ if(e.date) evCount[e.date]=(evCount[e.date]||0)+1; });
  const dows=['일','월','화','수','목','금','토'];
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calday empty"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const has=evCount[ds]>0, isT=ds===t, isS=S.ui.calSelDate===ds;
    cells+=`<button class="calday${has?' ev':''}${isT?' today':''}${isS?' sel':''}" onclick="calPick('${ds}')">${d}${has?'<span class="cdot"></span>':''}</button>`;
  }
  const sel=S.ui.calSelDate; let below='';
  if(sel){
    const list=S.events.filter(e=>e.date===sel);
    if(list.length){
      below=`<div class="calsel"><div class="calseltt">${selDateLabel(sel)} · 경조사 ${list.length}건</div>
        ${list.map(ev=>{const c=cfg(ev);return `<div class="calevrow" onclick="openEvent('${ev.id}')">
          <span class="cic">${c.icon}</span><span class="cnm">${esc(evNamePlain(ev))||'(이름 미입력)'}</span>
          <span class="ctag">${c.label}</span><span class="cchev">›</span></div>`;}).join('')}</div>`;
    } else {
      below=`<div class="calsel"><div class="calseltt">${selDateLabel(sel)} · 경조사 없음</div></div>`;
    }
  }
  return `<div class="card">
    <div class="calhead"><button class="calnav" onclick="calNav(-1)">‹</button>
      <div class="caltitle">${y}년 ${m}월 ${S.ui.calYM!==ymToday()?`<button class="minibtn" style="padding:3px 9px;font-size:11px;margin-left:6px" onclick="calToday()">오늘</button>`:''}</div>
      <button class="calnav" onclick="calNav(1)">›</button></div>
    <div class="calgrid">${dows.map((w,i)=>`<div class="caldow${i===0?' sun':''}">${w}</div>`).join('')}${cells}</div>
    ${below}
  </div>`;
}

function notifyCard(ev,me,nm){ // 명부 기록 — 항상 표시 (팝업을 놓쳐도 여기서 기록+전달)
  const mem=ev.type==='memorial'; const c=cfg(ev); const hasPay=!!(me&&me.pay&&me.pay.amount!=null);
  const pp=S.ui.guestSession.pendingPay; const mine=(!hasPay&&pp&&pp.evId===ev.id)?pp:null; // 송금 앱에 다녀온 뒤 아직 기록 전
  const payTxt=hasPay?`${c.money} ${won(me.pay.amount)}${me.pay.method==='toss'?' (토스)':me.pay.method==='kakao'?' (카카오페이)':me.pay.method==='cash'?' (현금 전달)':''}`:'';
  return `<div class="card" id="notifycard">

    <div class="tienote" style="margin:6px 0 10px">${mem?'🕊️ <b>기록해야 상주가 알 수 있어요.</b>':'💞 <b>기록해야 주최자가 알 수 있어요.</b>'}</div>
    ${hasPay?`<p class="sub" style="margin:0"><b>${esc(nm)}</b> · <b>${esc(payTxt)}</b></p>`
     :mine?`<p class="sub" style="margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span><b>${esc(nm||mine.name)}</b> · <b>${payMethodLabel(mine.method)} ${won(mine.amt)}</b></span><button class="minibtn" onclick="confirmPendingPay(0)">안 보냈어요</button></p>`:''}
    <button class="btn btn-primary" style="margin-top:11px" onclick="recordAndNotify()">${ledgerLabel(ev)}</button>
  </div>`; }
function recordAndNotify(){ const ev=curEvent(); if(!ev) return; // 기록이 없으면 입력칸(또는 대기 중 송금)의 금액으로 기록한 뒤 전달
  const nm=(S.ui.guestSession.name||($('#gname')&&$('#gname').value.trim())||(S.settings&&S.settings.name)||'').trim();
  if(!nm){ toast('성함을 입력해 주세요'); focusGname(); return; }
  const me=ev.guests.find(g=>g.name===nm);
  if(me&&me.pay&&me.pay.amount!=null){ S.ui.guestSession.name=nm; notifyHost(); return; }
  const pp=S.ui.guestSession.pendingPay; const mine=pp&&pp.evId===ev.id?pp:null;
  const typed=Number($('#sendamt')&&$('#sendamt').value)||0; const amt=typed||(mine?mine.amt:0); const fromPending=!typed&&!!mine;
  if(!amt){ toast('보낸 금액을 입력해 주세요'); const el=$('#sendamt'); if(el){ try{ el.focus(); }catch(e){} } return; }
  own(ev); S.ui.guestSession.name=nm;
  let x=ev.guests.find(g=>g.name===nm); if(!x){ x=mkGuest(nm,ev.myRelation||'지인',S.ui.guestSession.acctIdx||0); x.unregistered=true; ev.guests.push(x); }
  x.pay={amount:amt, source:'app', method:(mine&&(fromPending||mine.amt===amt)&&mine.method)||'account'}; ev.myGift=amt;
  if(mine){ S.ui.guestSession.pendingPay=null; payWatchStop(); } S.ui.guestSession.draftAmt=null; save(); render();
  setTimeout(notifyHost,150); }

function ledgerStats(ev){let total=0,appSum=0,manualSum=0,paid=0;
  ev.guests.forEach(x=>{ const p=x.pay||{}; if(p.amount>0){total+=p.amount;paid++; if(p.source==='app')appSum+=p.amount; else manualSum+=p.amount;}});
  return {total,appSum,manualSum,paid};}

function myStats(){ let given=0,gaveCount=0,received=0,recvCount=0; const byRel={};
  S.events.forEach(e=>{
    if(e.role==='host'){ const c=ledgerStats(e).total; if(c>0){received+=c;recvCount++;} }
    else if(e.myGift>0){ given+=e.myGift; gaveCount++; const r=e.myRelation||'기타'; byRel[r]=(byRel[r]||0)+e.myGift; }
  });
  (S.people||[]).forEach(p=>(p.items||[]).forEach(it=>{ // 사람 탭 수기 이력도 합산 (행사 연동분은 위에서 이미 집계)
    if(!(it.amount>0)) return;
    if(it.dir==='gave'){ given+=it.amount; gaveCount++; const r=p.relation||'기타'; byRel[r]=(byRel[r]||0)+it.amount; }
    else { received+=it.amount; recvCount++; }
  }));
  return {given,gaveCount,received,recvCount,net:received-given,byRel}; }

function setThanksPhoto(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;opacity:0'; document.body.appendChild(inp); // iOS: detached input GC 방지
  inp.onchange=e=>{ const f=e.target.files&&e.target.files[0]; try{ inp.remove(); }catch(_){} if(!f)return;
    const r=new FileReader(); r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const ev=hostEvent(); if(!ev)return;
        try{ const MAX=1400; const s=Math.min(1, MAX/Math.max(img.width,img.height)); // 카드 이미지는 글자 가독 위해 초대사진보다 큼
          const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          own(ev); ev.thanksPhoto=cv.toDataURL('image/jpeg',0.82);
        }catch(err){ if(r.result&&r.result.length<400000){ own(ev); ev.thanksPhoto=r.result; } else { toast('사진을 처리할 수 없어요 — 다른 사진으로 시도해 주세요'); } } save(); render(); };
      img.onerror=()=>{ toast('사진을 읽을 수 없어요 — JPG·PNG로 시도해 주세요'); };
      img.src=r.result; }; r.readAsDataURL(f); }; inp.click(); }

function sendCard(name,mark){ const ev=hostEvent(); const mem=ev.type==='memorial';

  const done=()=>{ if(mark) markThanked(name); };
  if(ev.thanksPhoto){
    try{
      const parts=ev.thanksPhoto.split(','); const bin=atob(parts[1]);
      const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const mime=((parts[0].match(/data:([^;]+)/)||[])[1])||'image/jpeg';
      const blob=new Blob([u8],{type:mime});
      const file=new File([blob],'감사인사.jpg',{type:mime});
      const fb=()=>{ if(noDownload()){ copy(text); toast('문구를 복사했어요 — 카톡에 사진과 함께 붙여넣어 보내세요'); return; }

  }

  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); // ② HTML 엔티티 (&를 안 막으면 &#39;가 디코드되며 ①을 우회)
function unifiedPeople(){ const map={};
  const push=(name,relation,item)=>{ const k=(name||'').trim(); if(!k)return;
    if(!map[k])map[k]={name:k,relation:relation||'',items:[]}; if(relation&&!map[k].relation)map[k].relation=relation; map[k].items.push(item); };
  (S.people||[]).forEach(p=>{ const k=(p.name||'').trim(); if(k&&!map[k]) map[k]={name:k,relation:p.relation||'',items:[]}; // 이력 0건도 목록·상세에 노출
    (p.items||[]).forEach(it=>push(p.name,p.relation,{dir:it.dir,amount:it.amount,label:it.label,date:it.date,src:'manual',auto:false,pid:p.id,iid:it.id})); });

  S.events.filter(e=>e.role!=='host'&&e.myGift>0).forEach(e=>{ push(evNamePlain(e), e.myRelation, {dir:'gave',amount:e.myGift,label:cfg(e).label+' '+cfg(e).money,date:e.date,src:'app',auto:true}); });
  return Object.values(map).sort((a,b)=>{ const la=a.items.reduce((m,i)=>(i.date||'')>m?i.date:m,''), lb=b.items.reduce((m,i)=>(i.date||'')>m?i.date:m,''); return lb.localeCompare(la); }); }

/* ======================= 품앗이 상호 알림: 주고받은 기록이 있는 분의 경조사를 놓치지 않게 =======================
   서버 없이 가능한 방식: 경조사의 주인공 이름을 내 '주고받은 사람' 기록과 매칭.
   ①상세 화면 품앗이 카드(받은 만큼 보답 원터치) ②추가 직후 토스트 ③임박 알림에 보답 문구. */
function reciOn(){ return true; } // v108: 품앗이 보답 안내 항상 켜짐(설정 토글 제거)
function reciFor(ev){ if(!reciOn()||!ev||ev.role==='host') return null;
  const names=[evNamePlain(ev),ev.partyA,ev.partyB].map(s=>(s||'').trim()).filter(s=>s.length>=2);
  if(!names.length) return null;
  try{ const ppl=unifiedPeople();
    for(const nm of names){ const p=ppl.find(x=>x.name===nm); if(!p) continue;
      // 이 행사에서 내가 보낸 기록은 '과거'가 아님 — 자동(myGift 파생)이든 수기든 같은 날짜의 gave는 이 행사 것으로 간주해 제외
      const items=p.items.filter(it=>!(it.dir==='gave'&&it.date===ev.date));
      if(!items.length) continue;
      let gave=0,recv=0,recvMax=0;
      items.forEach(it=>{ const a=it.amount||0; if(it.dir==='gave')gave+=a; else{ recv+=a; if(a>recvMax)recvMax=a; } });
      if(!gave&&!recv) continue;
      return {name:p.name,gave,recv,recvMax,count:items.length}; } }catch(e){}
  return null; }
function reciCard(ev){ const r=reciFor(ev); if(!r) return '';
  const mem=ev.type==='memorial';
  return `<div class="card" style="border-color:var(--gold);background:var(--tint2)">
    <div class="secthead"><div class="t">🌱 품앗이 — 주고받은 기록이 있는 분이에요</div>
      <button class="minibtn" onclick="openPerson('${jsq(r.name)}')">내역</button></div>
    <p class="sub" style="margin:6px 0 0"><b>${esc(r.name)}</b>님과 ${r.count}건 — 받은 ${won(r.recv)} · 보낸 ${won(r.gave)} ${balHint(r.gave-r.recv)}</p>
    ${r.recvMax>0?`<button class="btn btn-sage btn-sm" style="margin-top:10px" onclick="setAmt(${r.recvMax});toast('받은 만큼 채워뒀어요 — 아래에서 보내세요')">${mem?'🕊️ 받은 마음 돌려드리기':'💞 받은 만큼 보답하기'} · ${won(r.recvMax)}</button>`:''}
  </div>`; }

  setTimeout(()=>toast(`🌱 ${r.name}님과 주고받은 기록이 있어요${r.recvMax>0?(mem?` — 받은 ${won(r.recvMax)}, 마음을 돌려드릴 차례예요`:` — 받은 ${won(r.recvMax)}, 보답 잊지 마세요`):' — 상세에서 확인하세요'}`),700); }catch(e){} }

function upcomingSoon(){ const t=new Date(); t.setHours(0,0,0,0);
  return S.events.filter(e=>{ if(!e.date)return false; const d=new Date(e.date+'T00:00'); const days=Math.round((d-t)/86400000); return days>=0&&days<=7; })
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); }
function notiShow(title,opts){ // Android(설치형/TWA)는 페이지 컨텍스트 new Notification이 막혀 있어 SW 경유가 정석 — 데스크톱은 폴백
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(r=>{
        if(r&&r.showNotification) return r.showNotification(title,opts);
        new Notification(title,opts);
      }).catch(()=>{ try{ new Notification(title,opts); }catch(e){} });
      return;
    }
    new Notification(title,opts);
  }catch(e){} }
let BG_NOTI=false; // periodic sync 가용 여부 — 설정 카피·토글 안내를 정직하게 분기
try{ if('serviceWorker' in navigator) Promise.race([navigator.serviceWorker.ready.catch(()=>null), new Promise(r=>setTimeout(()=>r(null),4000))])
  .then(reg=>{ if(!NATIVE) BG_NOTI=!!(reg&&('periodicSync' in reg)); }); }catch(e){}
function syncNotiPref(){ try{ idbSet('noti', S.ui.noti?'1':'0'); }catch(e){} } // SW(백그라운드 체크)가 읽는 설정 미러
async function registerDailySync(){ try{ // 설치형 PWA/TWA에서만 지원 — 미지원·미설치는 조용히 무시(앱 열 때 알림으로 폴백)
  if(!('serviceWorker' in navigator)) return;
  const reg=await navigator.serviceWorker.ready;
  if(!reg||!('periodicSync' in reg)) return;
  try{ const st=await navigator.permissions.query({name:'periodic-background-sync'});
    if(st&&st.state==='denied') return; }catch(e){}
  await reg.periodicSync.register('ieum-daily',{minInterval:12*60*60*1000});
}catch(e){} }
function toggleNoti(){ if(!('Notification' in window)){ toast('이 브라우저는 알림을 지원하지 않아요'); return; }
  if(S.ui.noti){ S.ui.noti=false; save(); syncNotiPref(); render(); toast('알림을 껐어요'); return; }
  Promise.resolve(Notification.requestPermission()).then(p=>{ if(p==='granted'){ S.ui.noti=true; save(); syncNotiPref(); registerDailySync(); render();
      notiShow('이음 알림이 켜졌어요', {body:BG_NOTI?'경조사 일주일 전·전날·당일에 미리 알려드릴게요.':'앱을 열 때 다가온 경조사를 알려드릴게요.', icon:'icon-192.png'});
      fireDueNotis();
    } else { toast('알림 권한이 거부되었어요 — 브라우저 설정에서 허용해 주세요'); } }).catch(()=>toast('알림을 켤 수 없어요')); }
async function fireDueNotis(){ if(!S.ui.noti||!('Notification' in window)||Notification.permission!=='granted')return;
  let done={}; try{ const raw=await idbGet('notified'); if(raw) done=JSON.parse(raw); }catch(e){} // SW와 발화 기록 공유 — 중복 알림 방지
  const t=new Date(); t.setHours(0,0,0,0); let dirty=false;
  upcomingSoon().forEach(ev=>{ if(ev.demo||ev.tut||ev.draft||!(ev.partyA||'').trim()) return; // 샘플·초안·무명 행사 제외
    const d=new Date(ev.date+'T00:00'); const days=Math.round((d-t)/86400000);
    if(days!==0&&days!==1) return;
    const key=ev.id+':'+ev.date+':'+days; if(done[key]) return;
    try{ const r=reciFor(ev); // 품앗이: 주고받은 분의 행사면 보답 리마인드를 함께
      const reciTxt=r&&r.recvMax>0?(ev.type==='memorial'?` — 🌱 받은 ${won(r.recvMax)}, 마음을 돌려드릴 차례`:` — 🌱 받은 ${won(r.recvMax)}, 보답 잊지 마세요`):'';
      notiShow(`${evNamePlain(ev)} ${cfg(ev).label} ${dday(ev)}`, {body:`${dateText(ev)} · ${ev.venue||''}`+reciTxt, icon:'icon-192.png', tag:'ieum-due-'+ev.id+'-'+days});
      done[key]=Date.now(); dirty=true; }catch(e){} });
  if(dirty){ try{ idbSet('notified', JSON.stringify(done)); }catch(e){} } }

/* ---- 청첩장 URL 자동 분석: 서버가 없어 공개 CORS 프록시를 경유해 HTML을 읽음 ---- */
const INVITE_PROXIES=[
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)
];
async function fetchInviteBest(url){ // 프록시별 응답 품질이 달라, 파싱 결과가 가장 좋은 것을 채택 (SPA 셸만 받은 경우 다음 프록시 구제)
  let best=null,bestS=-1;
  for(const mk of INVITE_PROXIES){
    try{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(mk(url),{signal:ctl.signal}); clearTimeout(tm);
      if(!r.ok) continue; const t=await r.text();
      if(!t||t.length<300) continue;
      const p=parseInviteHtml(t,url);
      const s=(p.accounts?p.accounts.length*3:0)+(p.date?1:0)+(p.venue?1:0)+(p.names?1:0)+(p.img?1:0);
      if(s>bestS){ bestS=s; best=p; }
      if(p.accounts&&p.accounts.length&&p.date&&p.venue) break; // 충분히 좋음 — 추가 왕복 생략
    }catch(e){}
  }
  return best;
}
/* SPA 청첩장: 데이터가 script 내 JSON(__NEXT_DATA__ 등)에만 있는 경우가 많음 → 삭제 전에 문자열 값 채굴 */
function _jsonSlice(s){ let d=0,inS=false,esc=false; // 대입문 뒤 균형 중괄호까지 안전 절단
  for(let i=0;i<s.length;i++){ const c=s[i];
    if(esc){esc=false;continue;}
    if(c==='\\'){esc=true;continue;}
    if(inS){ if(c==='"')inS=false; continue; }
    if(c==='"')inS=true; else if(c==='{')d++; else if(c==='}'){d--; if(!d) return s.slice(0,i+1);} }
  return s; }
function _jsonLeaves(o,depth,acc){ acc=acc||{n:0}; if((depth||0)>8||acc.n>15000) return ''; let out=''; // acc=전체 예산 공유(레벨별 복리 폭주 방지)
  if(typeof o==='string'){ const v=o.trim();
    if(v&&v.length<=120&&!/^(https?:|data:|\/|#|<)/.test(v)){ out=v+'\n'; acc.n+=out.length; } }
  else if(Array.isArray(o)){ for(const x of o){ out+=_jsonLeaves(x,(depth||0)+1,acc); if(acc.n>15000)break; } }
  else if(o&&typeof o==='object'){ for(const k in o){ out+=_jsonLeaves(o[k],(depth||0)+1,acc); if(acc.n>15000)break; } }
  return out; }
/* 계좌 검출 v2 — 정순(은행→번호)·역순(번호→은행→예금주) 모두, 은행 별칭·전화번호 오탐 제거 */
const _BANKG='(KB\\s*국민|NH\\s*농협|IBK\\s*기업|SC\\s*제일|iM\\s*뱅크|카카오\\s*뱅크|토스\\s*뱅크|케이\\s*뱅크|새마을\\s*금고|우체국|국민|신한|우리|하나|농협|기업|수협|신협|씨티|부산|대구|광주|경남|전북|제주|산업)';
function _bankNorm(b){ b=(b||'').replace(/\s+/g,''); return ({'KB국민':'국민','NH농협':'농협','IBK기업':'기업'})[b]||b; }
const _HOLDER_BAD=/신랑|신부|어머니|아버지|혼주|계좌|은행|전하실|마음|축의|부의|예금주|입금주|복사|송금|입금|번호|하기$|보기$|^(입니다|으로|에게|한테|까지|부터|오시는|약도|안내|문의)/;
function _parseAccounts(all){
  all=String(all).replace(/[ \t]+\n/g,'\n').replace(/\n{2,}/g,'\n'); // 빈 줄 정리 — 실제 DOM 텍스트는 태그 사이 개행이 겹겹이라 '개행 1개' 규칙이 어긋남
  const accounts=[]; const seen=new Set();
  const push=(bank,num,holder,idx)=>{
    num=num.replace(/[–—―]/g,'-'); const digits=num.replace(/-/g,'');
    if(digits.length<10||digits.length>16||seen.has(digits)||accounts.length>=4) return;
    if(/^01[016789]/.test(digits)&&digits.length<=11) return; // 휴대폰
    if(/^0[2-6]\d/.test(digits)&&digits.length<=11) return;   // 유선전화 (0XX-XXXX-XXXX 11자리 포함)
    if(/^070/.test(digits)&&digits.length<=11) return;        // 인터넷전화
    if(/^050\d/.test(digits)&&digits.length<=12) return;      // 안심번호
    seen.add(digits);
    if(holder&&(_HOLDER_BAD.test(holder)||holder.length<2)) holder='';
    const back=all.slice(Math.max(0,idx-70),idx); // 측 라벨은 보통 앞줄에
    const label=/신부|장모|장인/.test(back)?'신부측':/신랑/.test(back)?'신랑측':(accounts.length===0?'신랑측':'신부측');
    accounts.push({label, bank:_bankNorm(bank), number:num, holder:holder||''});
  };
  const NUM='\\d[\\d\\-–—―]{7,20}\\d'; // 공백 불허 — 이웃 숫자(연도 등)와의 병합 방지
  let m;
  // 역순(번호→은행→예금주) 먼저 — 정순 패턴이 다음 줄 번호와 교차 페어링하는 것을 선점 차단.
  // 번호↔은행은 개행 1개까지, 예금주는 같은 줄에서 공백으로 구분된 경우만('은행입니다' 조사 미포착)
  const reB=new RegExp('('+NUM+')[ \\t]*\\n?[ \\t]*'+_BANKG+'(?:은행)?(?:[ \\t]*[:：])?(?:[ \\t]+\\(?([가-힣]{2,4})\\)?)?','g');
  while((m=reB.exec(all))){ let holder=m[3]||'';
    if(!holder){ // 예금주가 다음 줄에 오는 DOM 배치 — '단독 이름 줄'일 때만 채택 (인사말 줄 오염 방지)
      const nl=all.slice(m.index+m[0].length, m.index+m[0].length+40).split('\n');
      const cand=(/^[ \t]*$/.test(nl[0]||'')?(nl[1]||''):(nl[0]||''));
      holder=(cand.match(/^[ \t]*\(?([가-힣]{2,4})\)?[ \t]*$/)||[])[1]||''; }
    push(m[2],m[1],holder,m.index); }
  // 정순(은행→번호) — 은행↔번호도 개행 1개까지만 (멀리 떨어진 줄 간 오결합 방지)
  const reA=new RegExp(_BANKG+'(?:은행)?[ \\t]*(?:\\(([가-힣]{2,4})\\))?[ \\t]*[:：]?[ \\t]*\\n?[ \\t]*('+NUM+')','g');
  while((m=reA.exec(all))){
    let holder=m[2]||'';
    const fwd=all.slice(m.index+m[0].length, m.index+m[0].length+70);
    if(!holder) holder=(fwd.match(/(?:예금주|입금주)[ \t]*[:：]?[ \t]*([가-힣]{2,4})/)||[])[1]||'';
    if(!holder){ const nl=fwd.split('\n'); // 번호와 같은 줄 잔여 또는 바로 다음 줄의 단독 이름만 (멀리 있는 버튼 텍스트 제외)
      holder=((nl[0]||'').match(/^[ \t]*\(?([가-힣]{2,4})\)?[ \t]*$/)||((nl[1]||'').match(/^[ \t]*\(?([가-힣]{2,4})\)?[ \t]*$/))||[])[1]||''; }
    if(!holder){ const back=all.slice(Math.max(0,m.index-30),m.index); holder=(back.match(/([가-힣]{2,4})[ \t]*$/)||[])[1]||''; }
    push(m[1],m[3],holder,m.index);
  }
  return accounts;
}
function parseInviteHtml(html, url){
  // SPA 데이터(JSON) 채굴은 '원본' 문자열에서 — 개행 주입이 JSON 문자열 내부를 깨기 전에
  let jsonText=''; const _jb={n:0};
  try{ const sre=/<script\b([^>]*)>([\s\S]*?)<\/script/gi; let sm;
    while((sm=sre.exec(html)) && _jb.n<=15000){
      const attrs=sm[1]||'', t=sm[2]||''; if(!t||t.length<20) continue;
      let obj=null;
      if(/__NEXT_DATA__|json/i.test(attrs)){ try{ obj=JSON.parse(t); }catch(e){} }
      else{ const mm=t.match(/(?:__NUXT__|__INITIAL_STATE__|__APOLLO_STATE__|__PRELOADED_STATE__)\s*=\s*(\{[\s\S]*)/);
        if(mm){ try{ obj=JSON.parse(_jsonSlice(mm[1])); }catch(e){} } }
      if(obj) jsonText+=_jsonLeaves(obj,0,_jb);
    } }catch(e){}
  // 블록 경계에 개행 주입 → textContent가 줄 구조를 보존 (인사말 통짜·이웃 줄 오염 방지)
  html=html.replace(/<(?:br\s*\/?|\/(?:div|p|li|h[1-6]|tr|td|th|ul|ol|dl|dd|dt|table|section|article|header|footer))\s*>/gi, m=>m+'\n');
  const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=n=>{const m=doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`);return (m&&m.getAttribute('content'))||'';};
  const ogT=meta('og:title'), ogD=meta('og:description'), twT=meta('twitter:title'), twD=meta('twitter:description');
  let ogImg=meta('og:image'); try{ if(ogImg) ogImg=new URL(ogImg, url).href; }catch(e){ ogImg=''; }
  const title=(doc.querySelector('title')||{}).textContent||'';
  doc.querySelectorAll('script,style,noscript,svg').forEach(e=>e.remove());
  const body=((doc.body&&doc.body.textContent)||'').replace(/[ \t ]+/g,' ').slice(0,30000);
  const all=[ogT,ogD,twT,twD,title,body,jsonText].filter(Boolean).join('\n');
  const p=parseInvite(all); p.url=url; if(ogImg&&/^https:/.test(ogImg)) p.img=ogImg;
  p.accounts=_parseAccounts(all);
  return p;
}
let _impFetching=false;
async function fetchImportUrl(){
  const base=S.ui.importParsed; if(!base||!base.url||_impFetching) return;
  _impFetching=true; S.ui.importFetching=true; render();
  try{
    const add=await fetchInviteBest(base.url);
    const cur=S.ui.importParsed; // 사용자가 화면을 떠났으면 중단
    if(!cur || cur.url!==base.url){ return; }
    if(!add){ toast('청첩장 페이지를 읽지 못했어요 — 아래에서 직접 입력해 주세요'); return; }
    // 붙여넣은 텍스트에서 찾은 값이 우선, 빈 곳만 URL 분석값으로 채움
    ['names','date','time','venue'].forEach(k=>{ if(!cur[k]&&add[k]) cur[k]=add[k]; });
    if(add.type==='memorial'&&cur.type!=='memorial') cur.type='memorial'; // 페이지 본문에서 부고 확인되면 승격
    if(add.img) cur.img=add.img;
    if(add.accounts&&add.accounts.length) cur.accounts=add.accounts;
    save();
    const got=[cur.names&&'이름',cur.date&&'날짜',cur.venue&&'장소',(cur.accounts&&cur.accounts.length)&&`계좌 ${cur.accounts.length}개`].filter(Boolean);
    toast(got.length?`청첩장에서 ${got.join('·')}을 가져왔어요`:'페이지에서 정보를 찾지 못했어요 — 직접 입력해 주세요');
  } finally { _impFetching=false; S.ui.importFetching=false; render();

function parseInvite(text){

  const um=text.match(/https?:\/\/[^\s]+/); if(um) res.url=um[0];
  let y,mo,d, m=text.match(/(20\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})/);
  if(m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if(m=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)){ mo=+m[1]; d=+m[2]; }
  else if(m=text.match(/\b(\d{1,2})[\/.](\d{1,2})\b/)){ mo=+m[1]; d=+m[2]; }
  if(mo&&d&&mo>=1&&mo<=12&&d>=1&&d<=31){ if(!y){ const now=new Date(); y=now.getFullYear();
      if(new Date(y,mo-1,d) < new Date(now.toDateString())) y++; }
    res.date=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  let hh,mm=0,pm=false,am=false, tm=text.match(/(오전|오후)?\s*(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/);

  else if(tm=text.match(/\b(\d{1,2}):(\d{2})\b/)){ hh=+tm[1]; mm=+tm[2]; }
  if(hh!=null){ if(pm&&hh<12)hh+=12; if(am&&hh===12)hh=0; if(hh>=0&&hh<=23) res.time=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
  if(res.type==='memorial'){ // 고인 이름: 故 표기 우선, 없으면 '별세' 인접 이름 — 호칭(님)은 제거
    const gm=text.match(/故\s*([가-힣]{2,4})/)||text.match(/([가-힣]{2,4})\s*님?\s*(?:께서\s*)?(?:별세|작고|영면)/);

  let nm=text.match(/([가-힣]{2,4})\s*[♥❤♡💕&,·]\s*([가-힣]{2,4})/);

  return res;
}
function _stripDT(s){ return s // 장소 줄에 섞인 날짜·요일·시간 조각 제거
  .replace(/20\d{2}\s*[년.\-\/]\s*\d{1,2}\s*[월.\-\/]\s*\d{1,2}\s*일?/g,'')
  .replace(/\(?[월화수목금토일]\s*요일\)?|\([월화수목금토일]\)/g,'')
  .replace(/(오전|오후)\s*\d{1,2}\s*시\s*(\d{1,2}\s*분)?|\d{1,2}\s*:\s*\d{2}/g,'')
  .replace(/\s{2,}/g,' ').trim(); }
function _parseVenue(text){
  const lines=[]; text.split(/[\n\r]+/).forEach(l=>{ l=l.trim(); if(!l) return;
    if(l.length>60){ l.split(/[.!?…]\s+/).forEach(x=>{ x=x.trim(); if(x)lines.push(x); }); } else lines.push(l); });
  const NAVI=/카카오내비|네이버지도|티맵|자세히보기|지도보기|약도|주차|버스|지하철|셔틀|복사|길찾기/;
  const GREET=/(합니다|드립니다|드려요|해요|주세요|모시|축하|축복|감사|마음|저희|초대|배송|바랍니다|됩니다|입니다)/;
  // 1) '오시는 길' 류 섹션 제목 다음의 짧은 상호 줄 — 키워드 없는 상호(메종디탈리 등) 대응
  for(let i=0;i<lines.length;i++){
    if(!/^(오시는\s?[길곳]|LOCATION|위치|위치\s?안내|장소|장소\s?안내|예식장\s?안내|웨딩홀\s?안내)\s*$/i.test(lines[i])) continue;
    for(let k=i+1;k<Math.min(i+6,lines.length);k++){ const l=lines[k];
      if(NAVI.test(l)||/^[\d\s\-()+:~.]+$/.test(l)||/^(tel|전화|문의)/i.test(l)) continue;
      const v=_stripDT(l);
      if(v.length>=2&&v.length<=32&&!GREET.test(v)) return v.slice(0,40);
    }
    break;
  }
  // 2) 키워드 후보 스코어링 — '첫 매치 승리'가 인사말 통짜를 집던 문제를 최고점 선택으로 교체
  const vk=/(웨딩|컨벤션|호텔|예식장|홀|가든|하우스|채플|파티움|아트홀|타워|클럽|더라움|루체|아펠가모|메리어트|그랜드|워커힐|라마다|롯데|신라|반얀트리|스퀘어|컨벤션센터|성당|교회|장례식장)/;
  let best='',bestS=-99,bestSpec=false;
  for(const l0 of lines){ if(!vk.test(l0)) continue; const l=_stripDT(l0); if(!l) continue;
    let s=0; const spec=/(웨딩홀|컨벤션|아트홀|채플|예식장|가든|파티움|성당|교회|장례식장)/.test(l);
    if(spec) s+=2;
    if(l.length<=16) s+=2; else if(l.length<=26) s+=1; else s-=2;
    if(GREET.test(l)) s-=4;
    if(NAVI.test(l)) s-=3;
    if(/\d+\s*층|[가-힣A-Za-z]+\s*홀\s*$/.test(l)) s+=1;
    if(s>bestS){ bestS=s; best=l; bestSpec=spec; } }
  // 0점이라도 구체 시설어(웨딩홀 등)가 있으면 채택 — '○○웨딩홀에서 결혼합니다'형 og:description 구제
  return (bestS>0||(bestS===0&&bestSpec))?best.slice(0,40):'';
}

async function checkWebUpdate(force){ if(!NATIVE||!RELAY.url) return 'skip';

  let man=null; try{ const r=await fetch(RELAY.url+'/web?p=bundle.json&t='+now,{cache:'no-store'}); if(!r.ok) return 'nomanifest'; man=await r.json(); }catch(e){ return 'offline'; }

  if(man.build===APP_BUILD) return 'latest';
  let bad=''; try{ bad=localStorage.getItem('ieum_ota_bad')||''; }catch(_){} if(bad===man.build) return 'bad';
  let ready=''; try{ ready=localStorage.getItem('ieum_ota_ready')||''; }catch(_){}

      const r=await fetch(RELAY.url+'/web?p='+encodeURIComponent(f.p)+'&v='+encodeURIComponent(man.build),{cache:'no-store'}); if(!r.ok) throw new Error('dl '+f.p);

      if(hash!==f.h) throw new Error('hash '+f.p);

  const z=lzwEnc(json), p0=b64urlEnc(json); const enc=(z.length<p0.length?'z'+z:'p'+p0);
  if(!RELAY.url) throw new Error('relay');
  const k=Math.random().toString(36).slice(2,10).replace(/[^a-z0-9]/g,'a').padEnd(8,'a');
  const r=await fetch(RELAY.url+'/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k,j:enc})});
  if(!r.ok) throw new Error('post'); HANDOFF={k,ev,pp,err:null,busy:false}; render();
 }catch(e){ HANDOFF={k:null,ev:0,pp:0,err:'net',busy:false}; render(); } })(); }

function atTopLevel(){ return !S.ui.entered; } // 랜딩('내 경조사/호스트' 선택 화면)에서만 백=앱 종료 — 진입 후엔 항상 한 단계 위로

function backStep(){ // 한 단계 위로 (popstate·네이티브 뒤로가기 공용)
  try{
    if(document.getElementById('mapsheet')) closeMapSheet();
    else if(document.getElementById('tiepop')) closeTiePop();
    else if(document.getElementById('paypop')) closePayPop();   // 송금 복귀 확인 시트 — pendingPay는 유지되어 명부 카드의 [기록하기]가 폴백
    else if(document.getElementById('addpop')) closeAddSheet(); // 경조사 추가 선택 시트
    else if(document.getElementById('kpguide')) closeKpGuide();  // 카카오페이 링크 안내
    else if(document.getElementById('paysheet')) declinePass();
    else if(typeof TUT!=='undefined'&&TUT.on) endTutorial(false);
    else if(S.ui.tab==='host'){ if(S.ui.hostSub==='thanks'){ backFromHost2(); } else { backFromHost(); } }
    else { const v=S.ui.guestView;
      if(v==='invite') declineInvite();
      else if(v==='person'||v==='personadd') openPeople();
      else if(v==='tx') setGuestTab('ledger');
      else if(v==='allev') setGuestTab('list');
      else if(v==='people') setGuestTab('ledger');
      else if(v==='reco'){ const cid=S.ui.reco&&S.ui.reco.ctxEventId; if(cid&&S.events.some(e=>e.id===cid)) openEvent(cid); else setGuestTab('more'); } // 추천 탭이 사라져 더보기 하위 화면
      else if(v==='settings'||v==='doc') setGuestTab('more');
      else if(['list','ledger','more'].includes(v)) goLanding(); // 메인 탭에서 백=랜딩 (바로 종료 방지)
      else backToList(); }
  }catch(e){}
}
